<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" role="img" aria-labelledby="t d">
<title id="t">Rakshasutra checkpoint proposal</title><desc id="d">A BLE wristband sends an identifier to a pole. The pole can send a timestamped record through a LoRaWAN gateway to a server. The record names the last pole that received the band.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f5ef"/><stop offset="1" stop-color="#ebe7f1"/></linearGradient>
 <linearGradient id="violet" x2="1"><stop stop-color="#31203b"/><stop offset="1" stop-color="#50335f"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#24172b" flood-opacity=".12"/></filter>
 <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#412c4b" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1600" height="680" rx="36" fill="url(#bg)"/><rect width="1600" height="680" rx="36" fill="url(#grid)"/>
<text x="94" y="113" fill="#8b6517" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="5">RAKSHASUTRA · PROPOSAL</text>
<text x="92" y="220" fill="#24172b" font-family="Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-3">The last pole</text>
<text x="92" y="296" fill="#6c4a7e" font-family="Georgia,serif" font-size="68" font-style="italic">to receive the band.</text>
<text x="96" y="354" fill="#5d5662" font-family="Arial,sans-serif" font-size="23">BLE wristband and LoRaWAN checkpoint proposal</text>
<text x="96" y="389" fill="#5d5662" font-family="Arial,sans-serif" font-size="23">for selected points along pilgrim routes.</text>
<g transform="translate(105 465)">
 <rect width="366" height="88" rx="18" fill="#fffdf9" stroke="#d7cddc"/>
 <circle cx="42" cy="44" r="8" fill="#d59a22"/><text x="65" y="38" fill="#24172b" font-family="Arial,sans-serif" font-size="17" font-weight="700">PROPOSED SYSTEM</text>
 <text x="65" y="62" fill="#706776" font-family="Arial,sans-serif" font-size="15">Proposed design; not deployed.</text>
</g>
<g transform="translate(735 108)" filter="url(#shadow)">
 <path d="M90 284 C265 196 377 196 540 284" fill="none" stroke="#d69d2c" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round"/>
 <path d="M90 284 C265 196 377 196 540 284" fill="none" stroke="#725388" stroke-width="2" opacity=".4"/>
 <g transform="translate(0 185)">
