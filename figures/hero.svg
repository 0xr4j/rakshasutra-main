  <text x="85" y="132" text-anchor="middle" fill="#24172b" font-family="Arial,sans-serif" font-weight="700" font-size="17">SERVER</text>
  <text x="85" y="155" text-anchor="middle" fill="#706776" font-family="Arial,sans-serif" font-size="13">authorized lookup</text>
 </g>
</g>
<text x="807" y="626" fill="#6f6673" font-family="Arial,sans-serif" font-size="15">A pole record shows the last reception, not a live location.</text>
</svg>
