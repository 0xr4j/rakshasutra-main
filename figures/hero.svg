  <circle cx="85" cy="61" r="37" fill="#f2e9d2"/><path d="M63 63c10-27 33-31 46-14v28c-13 17-36 13-46-14Z" fill="none" stroke="#583e66" stroke-width="8"/><path d="M72 61h29" stroke="#d59a22" stroke-width="6" stroke-linecap="round"/>
  <text x="85" y="132" text-anchor="middle" fill="#24172b" font-family="Arial,sans-serif" font-weight="700" font-size="17">WRISTBAND</text>
  <text x="85" y="155" text-anchor="middle" fill="#706776" font-family="Arial,sans-serif" font-size="13">BLE broadcast</text>
 </g>
 <g transform="translate(220 118)">
