  <circle cx="85" cy="70" r="40" fill="#6a4b7a"/><path d="M85 38v67M65 105h40M74 123h22M57 62c15-16 41-16 56 0M48 49c21-24 53-24 74 0" fill="none" stroke="#f4d98b" stroke-width="4" stroke-linecap="round"/>
  <text x="85" y="172" text-anchor="middle" fill="#fffaf2" font-family="Arial,sans-serif" font-weight="700" font-size="17">SMART POLE</text>
  <text x="85" y="196" text-anchor="middle" fill="#d8c9df" font-family="Arial,sans-serif" font-size="13">checkpoint record</text>
  <rect x="29" y="211" width="112" height="22" rx="11" fill="#d69d2c"/><text x="85" y="226" text-anchor="middle" fill="#24172b" font-family="Arial,sans-serif" font-weight="700" font-size="10" letter-spacing="1">LAST HEARD</text>
 </g>
 <g transform="translate(440 185)">
  <rect width="170" height="178" rx="28" fill="#fffdf9" stroke="#ddd4e2"/>
