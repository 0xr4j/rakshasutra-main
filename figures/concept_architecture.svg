<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Rakshasutra concept architecture</title><desc id="desc">A conceptual path from a wearable BLE beacon through an edge pole to an on-premise server and control room. The links and system blocks are proposed, not field validated.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2d"/><stop offset="1" stop-color="#09101c"/></linearGradient><linearGradient id="a" x2="1"><stop stop-color="#1e6f78"/><stop offset="1" stop-color="#15424f"/></linearGradient><linearGradient id="b" x2="1"><stop stop-color="#375f9e"/><stop offset="1" stop-color="#273a66"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8ca9c8"/></marker></defs>
<rect width="1280" height="720" rx="26" fill="url(#bg)"/>
<text x="64" y="69" fill="#f4f7fb" font-family="Segoe UI,Arial" font-size="31" font-weight="700">Rakshasutra / SurakshaNet concept</text><text x="64" y="101" fill="#9eacc3" font-family="Segoe UI,Arial" font-size="16">Proposed data path; components, coverage, latency and safety are not deployment-validated.</text>
<g font-family="Segoe UI,Arial">
<rect x="65" y="216" width="230" height="245" rx="18" fill="#151f30" stroke="#426078"/><circle cx="180" cy="272" r="29" fill="url(#a)"/><path d="M167 271h26m-21-8q-10 8 0 16m16-16q10 8 0 16" fill="none" stroke="#8df0d9" stroke-width="3" stroke-linecap="round"/><text x="180" y="334" text-anchor="middle" fill="#f4f7fb" font-size="21" font-weight="700">Wearable band</text><text x="180" y="365" text-anchor="middle" fill="#bdc9d9" font-size="15">BLE advertisement</text><text x="180" y="390" text-anchor="middle" fill="#bdc9d9" font-size="15">rotating pseudonym*</text><text x="180" y="429" text-anchor="middle" fill="#8191aa" font-size="12">*Protocol details need review</text>
<rect x="368" y="216" width="238" height="245" rx="18" fill="#151f30" stroke="#426078"/><circle cx="487" cy="272" r="29" fill="url(#a)"/><path d="M474 289v-24m13 24v-37m13 37v-18" stroke="#8df0d9" stroke-width="4" stroke-linecap="round"/><text x="487" y="334" text-anchor="middle" fill="#f4f7fb" font-size="21" font-weight="700">Smart pole</text><text x="487" y="365" text-anchor="middle" fill="#bdc9d9" font-size="15">BLE reception + filtering</text><text x="487" y="390" text-anchor="middle" fill="#bdc9d9" font-size="15">chunked LoRa uplink*</text><text x="487" y="429" text-anchor="middle" fill="#8191aa" font-size="12">*Payload and load assumptions open</text>
<rect x="683" y="216" width="235" height="245" rx="18" fill="#151f30" stroke="#426078"/><circle cx="800" cy="272" r="29" fill="url(#b)"/><path d="M784 267h32v22h-32zm6-7h20m-20 36h20" fill="none" stroke="#c1d6ff" stroke-width="3"/><text x="800" y="334" text-anchor="middle" fill="#f4f7fb" font-size="21" font-weight="700">Local backend</text><text x="800" y="365" text-anchor="middle" fill="#bdc9d9" font-size="15">identity resolution*</text><text x="800" y="390" text-anchor="middle" fill="#bdc9d9" font-size="15">event store + alerts</text><text x="800" y="429" text-anchor="middle" fill="#8191aa" font-size="12">*Privacy / security review needed</text>
<rect x="995" y="216" width="220" height="245" rx="18" fill="#151f30" stroke="#426078"/><circle cx="1105" cy="272" r="29" fill="url(#b)"/><path d="M1090 286v-18l15-11 15 11v18zm8 0v-13h14v13" fill="none" stroke="#c1d6ff" stroke-width="3"/><text x="1105" y="334" text-anchor="middle" fill="#f4f7fb" font-size="21" font-weight="700">Control point</text><text x="1105" y="365" text-anchor="middle" fill="#bdc9d9" font-size="15">operator / family alert</text><text x="1105" y="390" text-anchor="middle" fill="#bdc9d9" font-size="15">kiosk / response workflow</text><text x="1105" y="429" text-anchor="middle" fill="#8191aa" font-size="12">Human process not yet trialed</text>
<path d="M296 335h60m250 0h60m249 0h60" fill="none" stroke="#8ca9c8" stroke-width="3" marker-end="url(#arrow)"/><text x="326" y="315" text-anchor="middle" fill="#8df0d9" font-size="13">BLE</text><text x="638" y="315" text-anchor="middle" fill="#c1d6ff" font-size="13">LoRa / wired backhaul*</text><text x="956" y="315" text-anchor="middle" fill="#c1d6ff" font-size="13">local network*</text>
<rect x="65" y="535" width="1150" height="99" rx="15" fill="#111b2b" stroke="#2d3c54"/><text x="95" y="574" fill="#ffbf69" font-size="16" font-weight="700">Validation boundary</text><text x="95" y="604" fill="#c4cedd" font-size="14">This diagram depicts the proposal only. It does not imply hardware exists, links meet range claims, alerts meet latency targets, or the system is safe for deployment.</text>
</g></svg>
