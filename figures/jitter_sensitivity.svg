<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
<title id="title">Packet loss at four batch delays</title>
<desc id="desc">In this synthetic model, packet loss falls as the send-delay range widens. No field data are included.</desc>
<rect width="100%" height="100%" fill="#0b1120"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#f4f7fb;font-size:23px;font-weight:700}.sub{fill:#9eacc3;font-size:13px}.grid{stroke:#26344b}.line{fill:none;stroke:#58d6c5;stroke-width:4}.point{fill:#ffbf69;stroke:#0b1120;stroke-width:2}</style>
<text x="70" y="38" class="title">Wider batch timing lowers simulated loss</text>
<text x="70" y="60" class="sub">Synthetic one-cell model · 40 runs per setting · no field data</text>
<line x1="90" y1="385.0" x2="865" y2="385.0" class="grid"/>
<text x="78" y="389.0" text-anchor="end" class="sub">0%</text>
<line x1="90" y1="321.0" x2="865" y2="321.0" class="grid"/>
<text x="78" y="325.0" text-anchor="end" class="sub">20%</text>
<line x1="90" y1="257.0" x2="865" y2="257.0" class="grid"/>
<text x="78" y="261.0" text-anchor="end" class="sub">40%</text>
<line x1="90" y1="193.0" x2="865" y2="193.0" class="grid"/>
<text x="78" y="197.0" text-anchor="end" class="sub">60%</text>
<line x1="90" y1="129.0" x2="865" y2="129.0" class="grid"/>
<text x="78" y="133.0" text-anchor="end" class="sub">80%</text>
<line x1="90" y1="65.0" x2="865" y2="65.0" class="grid"/>
<text x="78" y="69.0" text-anchor="end" class="sub">100%</text>
<line x1="90.0" y1="65" x2="90.0" y2="385" class="grid" opacity=".5"/>
<text x="90.0" y="409" text-anchor="middle" class="sub">0</text>
<line x1="167.5" y1="65" x2="167.5" y2="385" class="grid" opacity=".5"/>
<text x="167.5" y="409" text-anchor="middle" class="sub">1.5</text>
<line x1="283.8" y1="65" x2="283.8" y2="385" class="grid" opacity=".5"/>
<text x="283.8" y="409" text-anchor="middle" class="sub">3.75</text>
<line x1="477.5" y1="65" x2="477.5" y2="385" class="grid" opacity=".5"/>
<text x="477.5" y="409" text-anchor="middle" class="sub">7.5</text>
<line x1="606.7" y1="65" x2="606.7" y2="385" class="grid" opacity=".5"/>
<text x="606.7" y="409" text-anchor="middle" class="sub">10</text>
<line x1="865.0" y1="65" x2="865.0" y2="385" class="grid" opacity=".5"/>
<text x="865.0" y="409" text-anchor="middle" class="sub">15</text>
<polyline points="167.5,152.0 283.8,226.6 477.5,281.2 865.0,317.7" class="line"/>
<circle cx="167.5" cy="152.0" r="7" class="point"/>
<text x="167.5" y="139.0" text-anchor="middle" class="sub">72.8%</text>
<circle cx="283.8" cy="226.6" r="7" class="point"/>
<text x="283.8" y="213.6" text-anchor="middle" class="sub">49.5%</text>
<circle cx="477.5" cy="281.2" r="7" class="point"/>
<text x="477.5" y="268.2" text-anchor="middle" class="sub">32.4%</text>
<circle cx="865.0" cy="317.7" r="7" class="point"/>
<text x="865.0" y="304.7" text-anchor="middle" class="sub">21.0%</text>
<line x1="90" y1="65" x2="90" y2="385" stroke="#61718b"/>
<line x1="90" y1="385" x2="865" y2="385" stroke="#61718b"/>
<text x="477.5" y="454" text-anchor="middle" class="sub">Maximum random send delay within each 15 s flush window (seconds)</text>
<text x="24" y="245" transform="rotate(-90 24 245)" text-anchor="middle" class="sub">Mean simulated packet loss</text>
<text x="70" y="455" class="sub">Assumed inputs; no RF capture or retries; no field observations.</text>
</svg>